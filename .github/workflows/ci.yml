# =============================================================================
# ci.yml
# -----------------------------------------------------------------------------
# GitHub Actions port of .gitlab-ci.yml (4 stages: validate, plan, apply,
# destroy over a single terraform/kubernetes root, cloud selected via
# TF_VAR_cloud_provider + a backend_override.tf copied in from
# backends/{s3,azurerm,gcs}.tf).
#
#   * secret_detection (GitLab managed Secret-Detection template)
#       -> security-scan-gate (reusable workflow, same as platform-gitops and
#          deployment already migrated), gitleaks covers secret detection.
#   * checkov   -> checkov job. No cloud dependency, ported 1:1, runs for real.
#   * validate  -> validate job. STRUCTURAL PORT ONLY. No cloud secrets are
#          configured on this GitHub repo yet (Azure infra isn't deployed;
#          the user is deliberately holding off on wiring cloud credentials
#          until it is). This job only runs on workflow_dispatch (never on
#          push/pull_request) so it can never fail a normal CI run, and it
#          WILL fail today if manually dispatched, exactly as expected, at
#          the `: "${AWS_ROLE_ARN:?...}"`-style guards below. Cloud login is
#          ported as-is from GitLab: AWS via OIDC assume-role-with-web-
#          identity (GitHub's OIDC token exchanged for `sts.amazonaws.com`,
#          same idea as GitLab's id_tokens: block), Azure via static
#          ARM_CLIENT_ID/ARM_CLIENT_SECRET/ARM_TENANT_ID/ARM_SUBSCRIPTION_ID
#          (this repo does not use Azure OIDC, unlike the sibling
#          `infrastructure` repo - not upgraded here, ported as-is), GCP via
#          a service-account JSON key. Revisit once Azure infra is live.
#   * plan / apply / destroy -> same structural-only caveat as validate.
#          `apply`/`destroy` are GitLab `when: manual` jobs; here they only
#          run when workflow_dispatch's `action` input selects them. GitLab's
#          `environment: ... on_stop: destroy` / `action: stop` linkage has
#          no GitHub Actions Environments equivalent configured yet (no
#          Environments/protection rules exist on this repo) - `environment:`
#          below is set for tracking only, follow-up work.
#
# Required secrets/vars once cloud wiring goes live (Phase 5, not this task):
#   Secrets: AWS_ROLE_ARN, AWS_TF_STATE_BUCKET, ARM_CLIENT_ID,
#            ARM_CLIENT_SECRET, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID,
#            GCP_SERVICE_ACCOUNT_KEY, GCP_PROJECT_ID, GITLAB_ACCESS_TOKEN
#   Variables: AWS_REGION, GCP_REGION, GCP_ZONE, PROJECT_NAMESPACE,
#              GITLAB_USERNAME
# =============================================================================

name: Kubernetes Infrastructure CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: Cloud provider to target
        required: true
        type: choice
        default: aws
        options:
          - aws
          - azure
          - gcp
      environment_name:
        description: Terraform workspace / environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod
      action:
        description: What to do after validate+plan (apply/destroy require explicitly selecting them; plan always runs)
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

env:
  TF_ROOT: terraform/kubernetes
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.12.0"

jobs:
  # ---------------------------------------------------------------------------
  # GitHub replacement for `include: Security/Secret-Detection.gitlab-ci.yml`.
  # ---------------------------------------------------------------------------
  security-scan-gate:
    name: Security scan gate
    uses: devdanielgherasim/micro-market-utilities/.github/workflows/security-scan-gate.yml@main
    with:
      codeql-languages: actions

  # ---------------------------------------------------------------------------
  # 1:1 port of the `checkov` job. No cloud dependency - works today.
  # ---------------------------------------------------------------------------
  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Scan Terraform with Checkov
        run: |
          set -eu
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            bridgecrew/checkov:latest \
            -d terraform/ \
            --config-file .checkov.yaml \
            --compact \
            --quiet

  # ---------------------------------------------------------------------------
  # Port of the `validate` job (cloud login + `terraform init` against the
  # real backend + `terraform validate` + `terraform fmt -check`).
  # STRUCTURAL ONLY - see header comment. Only runs on workflow_dispatch.
  # ---------------------------------------------------------------------------
  validate:
    name: Terraform validate (structural port - unverified, no cloud secrets yet)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
      ENVIRONMENT: ${{ inputs.environment_name }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_TF_STATE_BUCKET: ${{ secrets.AWS_TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Cloud login + terraform init + validate + fmt (unverified until cloud credentials are wired up)
        run: |
          set -eu
          : "${CLOUD_PROVIDER:?workflow_dispatch input cloud_provider is required}"
          WORKSPACE="${ENVIRONMENT:-dev}"
          echo "Using workspace ${WORKSPACE}"
          case "${CLOUD_PROVIDER}" in
            aws)
              : "${AWS_ROLE_ARN:?Set the AWS_ROLE_ARN secret to the IAM role trusted for GitHub OIDC federation}"
              GH_OIDC_TOKEN=$(curl -sSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
              CREDS=$(aws sts assume-role-with-web-identity \
                --role-arn "${AWS_ROLE_ARN}" \
                --role-session-name "gha-${GITHUB_RUN_ID}" \
                --web-identity-token "${GH_OIDC_TOKEN}" \
                --duration-seconds 3600)
              AWS_ACCESS_KEY_ID=$(echo "${CREDS}" | jq -r '.Credentials.AccessKeyId')
              AWS_SECRET_ACCESS_KEY=$(echo "${CREDS}" | jq -r '.Credentials.SecretAccessKey')
              AWS_SESSION_TOKEN=$(echo "${CREDS}" | jq -r '.Credentials.SessionToken')
              export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
              export TF_VAR_aws_region="${AWS_REGION:-eu-central-1}"
              export TF_VAR_cloud_provider="aws"
              export TF_VAR_aws_remote_state_bucket="${AWS_TF_STATE_BUCKET}"
              export TF_VAR_remote_state_bucket="${AWS_TF_STATE_BUCKET}"
              BACKEND_TYPE="s3"
              ;;
            azure)
              export TF_VAR_client_id="${ARM_CLIENT_ID}"
              export TF_VAR_client_secret="${ARM_CLIENT_SECRET}"
              export TF_VAR_tenant_id="${ARM_TENANT_ID}"
              export TF_VAR_subscription_id="${ARM_SUBSCRIPTION_ID}"
              export TF_VAR_cloud_provider="azure"
              BACKEND_TYPE="azurerm"
              ;;
            gcp)
              echo "${GCP_SERVICE_ACCOUNT_KEY}" > gcp-credentials.json
              export GOOGLE_APPLICATION_CREDENTIALS="${GITHUB_WORKSPACE}/gcp-credentials.json"
              export TF_VAR_gcp_credentials="${GOOGLE_APPLICATION_CREDENTIALS}"
              export TF_VAR_gcp_project="${GCP_PROJECT_ID}"
              export TF_VAR_gcp_region="${GCP_REGION:-europe-central2}"
              export TF_VAR_gcp_zone="${GCP_ZONE:-europe-central2-a}"
              export TF_VAR_cloud_provider="gcp"
              BACKEND_TYPE="gcs"
              ;;
            *)
              echo "ERROR: Unsupported cloud provider: ${CLOUD_PROVIDER}. Must be one of: aws, azure, gcp" >&2
              exit 1
              ;;
          esac
          cd "${TF_ROOT}"
          echo "Initializing Terraform with ${BACKEND_TYPE} backend..."
          cp "backends/${BACKEND_TYPE}.tf" backend_override.tf
          case "${CLOUD_PROVIDER}" in
            aws)
              terraform init -reconfigure -upgrade \
                -backend-config="backends/s3.hcl" \
                -backend-config="bucket=${AWS_TF_STATE_BUCKET}" \
                -backend-config="key=kubernetes/aws/${WORKSPACE}/terraform.tfstate"
              ;;
            azure)
              terraform init -reconfigure -upgrade -backend-config="backends/azurerm.hcl"
              ;;
            gcp)
              terraform init -reconfigure -upgrade -backend-config="backends/gcs.hcl"
              ;;
          esac
          if terraform workspace list | grep -q "${WORKSPACE}"; then
            terraform workspace select "${WORKSPACE}"
          else
            terraform workspace new "${WORKSPACE}"
          fi
          echo "Current workspace: $(terraform workspace show)"
          echo "Validating Terraform configuration..."
          terraform validate
          terraform fmt -check -diff -recursive
          echo "Terraform validation completed successfully."

  # ---------------------------------------------------------------------------
  # Port of the `plan` job. STRUCTURAL ONLY - see header comment. GitLab vars
  # gitlab_token/gitlab_username kept as-is (ArgoCD git source still points at
  # GitLab - that cutover is a separate later phase, not this task).
  # ---------------------------------------------------------------------------
  plan:
    name: Terraform plan (structural port - unverified, no cloud secrets yet)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
      ENVIRONMENT: ${{ inputs.environment_name }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_TF_STATE_BUCKET: ${{ secrets.AWS_TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      PROJECT_NAMESPACE: ${{ vars.PROJECT_NAMESPACE }}
      GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      GITLAB_USERNAME: ${{ vars.GITLAB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Cloud login + terraform init + plan (unverified until cloud credentials are wired up)
        run: |
          set -eu
          : "${CLOUD_PROVIDER:?workflow_dispatch input cloud_provider is required}"
          WORKSPACE="${ENVIRONMENT:-dev}"
          echo "Using workspace ${WORKSPACE}"
          case "${CLOUD_PROVIDER}" in
            aws)
              : "${AWS_ROLE_ARN:?Set the AWS_ROLE_ARN secret to the IAM role trusted for GitHub OIDC federation}"
              GH_OIDC_TOKEN=$(curl -sSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
              CREDS=$(aws sts assume-role-with-web-identity \
                --role-arn "${AWS_ROLE_ARN}" \
                --role-session-name "gha-${GITHUB_RUN_ID}" \
                --web-identity-token "${GH_OIDC_TOKEN}" \
                --duration-seconds 3600)
              AWS_ACCESS_KEY_ID=$(echo "${CREDS}" | jq -r '.Credentials.AccessKeyId')
              AWS_SECRET_ACCESS_KEY=$(echo "${CREDS}" | jq -r '.Credentials.SecretAccessKey')
              AWS_SESSION_TOKEN=$(echo "${CREDS}" | jq -r '.Credentials.SessionToken')
              export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
              export TF_VAR_aws_region="${AWS_REGION:-eu-central-1}"
              export TF_VAR_cloud_provider="aws"
              export TF_VAR_aws_remote_state_bucket="${AWS_TF_STATE_BUCKET}"
              export TF_VAR_remote_state_bucket="${AWS_TF_STATE_BUCKET}"
              BACKEND_TYPE="s3"
              ;;
            azure)
              export TF_VAR_client_id="${ARM_CLIENT_ID}"
              export TF_VAR_client_secret="${ARM_CLIENT_SECRET}"
              export TF_VAR_tenant_id="${ARM_TENANT_ID}"
              export TF_VAR_subscription_id="${ARM_SUBSCRIPTION_ID}"
              export TF_VAR_cloud_provider="azure"
              BACKEND_TYPE="azurerm"
              ;;
            gcp)
              echo "${GCP_SERVICE_ACCOUNT_KEY}" > gcp-credentials.json
              export GOOGLE_APPLICATION_CREDENTIALS="${GITHUB_WORKSPACE}/gcp-credentials.json"
              export TF_VAR_gcp_credentials="${GOOGLE_APPLICATION_CREDENTIALS}"
              export TF_VAR_gcp_project="${GCP_PROJECT_ID}"
              export TF_VAR_gcp_region="${GCP_REGION:-europe-central2}"
              export TF_VAR_gcp_zone="${GCP_ZONE:-europe-central2-a}"
              export TF_VAR_cloud_provider="gcp"
              BACKEND_TYPE="gcs"
              ;;
            *)
              echo "ERROR: Unsupported cloud provider: ${CLOUD_PROVIDER}. Must be one of: aws, azure, gcp" >&2
              exit 1
              ;;
          esac
          cd "${TF_ROOT}"
          echo "Initializing Terraform with ${BACKEND_TYPE} backend..."
          cp "backends/${BACKEND_TYPE}.tf" backend_override.tf
          case "${CLOUD_PROVIDER}" in
            aws)
              terraform init -reconfigure -upgrade \
                -backend-config="backends/s3.hcl" \
                -backend-config="bucket=${AWS_TF_STATE_BUCKET}" \
                -backend-config="key=kubernetes/aws/${WORKSPACE}/terraform.tfstate"
              ;;
            azure)
              terraform init -reconfigure -upgrade -backend-config="backends/azurerm.hcl"
              ;;
            gcp)
              terraform init -reconfigure -upgrade -backend-config="backends/gcs.hcl"
              ;;
          esac
          if terraform workspace list | grep -q "${WORKSPACE}"; then
            terraform workspace select "${WORKSPACE}"
          else
            terraform workspace new "${WORKSPACE}"
          fi
          echo "Current workspace: $(terraform workspace show)"
          echo "Planning Terraform infrastructure changes..."
          terraform plan \
            --var-file="./tfvars_files/${WORKSPACE}.tfvars" \
            -var project_name="${PROJECT_NAMESPACE}" \
            -var gitlab_token="${GITLAB_ACCESS_TOKEN}" \
            -var gitlab_username="${GITLAB_USERNAME}" \
            -out=tfplan
          terraform show -json tfplan > plan.json
          echo "Terraform plan completed and saved to tfplan."

      - uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ inputs.cloud_provider }}-${{ inputs.environment_name }}
          path: |
            ${{ env.TF_ROOT }}/tfplan
            ${{ env.TF_ROOT }}/plan.json
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Port of the `apply` job (GitLab `when: manual`). STRUCTURAL ONLY - see
  # header comment. Only runs when workflow_dispatch's `action` input is
  # `apply`. GitLab's `environment: ... on_stop: destroy` has no GitHub
  # Actions Environments equivalent wired up yet (follow-up, not this task).
  # ---------------------------------------------------------------------------
  apply:
    name: Terraform apply (manual, structural port - unverified)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: plan
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
      ENVIRONMENT: ${{ inputs.environment_name }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_TF_STATE_BUCKET: ${{ secrets.AWS_TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: actions/download-artifact@v8
        with:
          name: tfplan-${{ inputs.cloud_provider }}-${{ inputs.environment_name }}
          path: ${{ env.TF_ROOT }}

      - name: Cloud login + terraform init + apply (unverified until cloud credentials are wired up)
        run: |
          set -eu
          : "${CLOUD_PROVIDER:?workflow_dispatch input cloud_provider is required}"
          WORKSPACE="${ENVIRONMENT:-dev}"
          echo "Using workspace ${WORKSPACE}"
          case "${CLOUD_PROVIDER}" in
            aws)
              : "${AWS_ROLE_ARN:?Set the AWS_ROLE_ARN secret to the IAM role trusted for GitHub OIDC federation}"
              GH_OIDC_TOKEN=$(curl -sSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
              CREDS=$(aws sts assume-role-with-web-identity \
                --role-arn "${AWS_ROLE_ARN}" \
                --role-session-name "gha-${GITHUB_RUN_ID}" \
                --web-identity-token "${GH_OIDC_TOKEN}" \
                --duration-seconds 3600)
              AWS_ACCESS_KEY_ID=$(echo "${CREDS}" | jq -r '.Credentials.AccessKeyId')
              AWS_SECRET_ACCESS_KEY=$(echo "${CREDS}" | jq -r '.Credentials.SecretAccessKey')
              AWS_SESSION_TOKEN=$(echo "${CREDS}" | jq -r '.Credentials.SessionToken')
              export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
              export TF_VAR_aws_region="${AWS_REGION:-eu-central-1}"
              export TF_VAR_cloud_provider="aws"
              export TF_VAR_aws_remote_state_bucket="${AWS_TF_STATE_BUCKET}"
              export TF_VAR_remote_state_bucket="${AWS_TF_STATE_BUCKET}"
              BACKEND_TYPE="s3"
              ;;
            azure)
              export TF_VAR_client_id="${ARM_CLIENT_ID}"
              export TF_VAR_client_secret="${ARM_CLIENT_SECRET}"
              export TF_VAR_tenant_id="${ARM_TENANT_ID}"
              export TF_VAR_subscription_id="${ARM_SUBSCRIPTION_ID}"
              export TF_VAR_cloud_provider="azure"
              BACKEND_TYPE="azurerm"
              ;;
            gcp)
              echo "${GCP_SERVICE_ACCOUNT_KEY}" > gcp-credentials.json
              export GOOGLE_APPLICATION_CREDENTIALS="${GITHUB_WORKSPACE}/gcp-credentials.json"
              export TF_VAR_gcp_credentials="${GOOGLE_APPLICATION_CREDENTIALS}"
              export TF_VAR_gcp_project="${GCP_PROJECT_ID}"
              export TF_VAR_gcp_region="${GCP_REGION:-europe-central2}"
              export TF_VAR_gcp_zone="${GCP_ZONE:-europe-central2-a}"
              export TF_VAR_cloud_provider="gcp"
              BACKEND_TYPE="gcs"
              ;;
            *)
              echo "ERROR: Unsupported cloud provider: ${CLOUD_PROVIDER}. Must be one of: aws, azure, gcp" >&2
              exit 1
              ;;
          esac
          cd "${TF_ROOT}"
          echo "Initializing Terraform with ${BACKEND_TYPE} backend..."
          cp "backends/${BACKEND_TYPE}.tf" backend_override.tf
          case "${CLOUD_PROVIDER}" in
            aws)
              terraform init -reconfigure -upgrade \
                -backend-config="backends/s3.hcl" \
                -backend-config="bucket=${AWS_TF_STATE_BUCKET}" \
                -backend-config="key=kubernetes/aws/${WORKSPACE}/terraform.tfstate"
              ;;
            azure)
              terraform init -reconfigure -upgrade -backend-config="backends/azurerm.hcl"
              ;;
            gcp)
              terraform init -reconfigure -upgrade -backend-config="backends/gcs.hcl"
              ;;
          esac
          if terraform workspace list | grep -q "${WORKSPACE}"; then
            terraform workspace select "${WORKSPACE}"
          else
            terraform workspace new "${WORKSPACE}"
          fi
          echo "Current workspace: $(terraform workspace show)"
          echo "Applying Terraform infrastructure changes..."
          terraform apply -auto-approve tfplan
          echo "Terraform apply completed successfully."

  # ---------------------------------------------------------------------------
  # Port of the `destroy` job (GitLab `when: manual`, `allow_failure: true`).
  # STRUCTURAL ONLY - see header comment. Only runs when workflow_dispatch's
  # `action` input is `destroy`.
  # ---------------------------------------------------------------------------
  destroy:
    name: Terraform destroy (manual, structural port - unverified)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    needs: validate
    environment: ${{ inputs.environment_name }}
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
      ENVIRONMENT: ${{ inputs.environment_name }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_TF_STATE_BUCKET: ${{ secrets.AWS_TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ZONE: ${{ vars.GCP_ZONE }}
      PROJECT_NAMESPACE: ${{ vars.PROJECT_NAMESPACE }}
      GITLAB_ACCESS_TOKEN: ${{ secrets.GITLAB_ACCESS_TOKEN }}
      GITLAB_USERNAME: ${{ vars.GITLAB_USERNAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Cloud login + terraform init + destroy (unverified until cloud credentials are wired up)
        run: |
          set -eu
          : "${CLOUD_PROVIDER:?workflow_dispatch input cloud_provider is required}"
          WORKSPACE="${ENVIRONMENT:-dev}"
          echo "Using workspace ${WORKSPACE}"
          case "${CLOUD_PROVIDER}" in
            aws)
              : "${AWS_ROLE_ARN:?Set the AWS_ROLE_ARN secret to the IAM role trusted for GitHub OIDC federation}"
              GH_OIDC_TOKEN=$(curl -sSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
              CREDS=$(aws sts assume-role-with-web-identity \
                --role-arn "${AWS_ROLE_ARN}" \
                --role-session-name "gha-${GITHUB_RUN_ID}" \
                --web-identity-token "${GH_OIDC_TOKEN}" \
                --duration-seconds 3600)
              AWS_ACCESS_KEY_ID=$(echo "${CREDS}" | jq -r '.Credentials.AccessKeyId')
              AWS_SECRET_ACCESS_KEY=$(echo "${CREDS}" | jq -r '.Credentials.SecretAccessKey')
              AWS_SESSION_TOKEN=$(echo "${CREDS}" | jq -r '.Credentials.SessionToken')
              export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
              export TF_VAR_aws_region="${AWS_REGION:-eu-central-1}"
              export TF_VAR_cloud_provider="aws"
              export TF_VAR_aws_remote_state_bucket="${AWS_TF_STATE_BUCKET}"
              export TF_VAR_remote_state_bucket="${AWS_TF_STATE_BUCKET}"
              BACKEND_TYPE="s3"
              ;;
            azure)
              export TF_VAR_client_id="${ARM_CLIENT_ID}"
              export TF_VAR_client_secret="${ARM_CLIENT_SECRET}"
              export TF_VAR_tenant_id="${ARM_TENANT_ID}"
              export TF_VAR_subscription_id="${ARM_SUBSCRIPTION_ID}"
              export TF_VAR_cloud_provider="azure"
              BACKEND_TYPE="azurerm"
              ;;
            gcp)
              echo "${GCP_SERVICE_ACCOUNT_KEY}" > gcp-credentials.json
              export GOOGLE_APPLICATION_CREDENTIALS="${GITHUB_WORKSPACE}/gcp-credentials.json"
              export TF_VAR_gcp_credentials="${GOOGLE_APPLICATION_CREDENTIALS}"
              export TF_VAR_gcp_project="${GCP_PROJECT_ID}"
              export TF_VAR_gcp_region="${GCP_REGION:-europe-central2}"
              export TF_VAR_gcp_zone="${GCP_ZONE:-europe-central2-a}"
              export TF_VAR_cloud_provider="gcp"
              BACKEND_TYPE="gcs"
              ;;
            *)
              echo "ERROR: Unsupported cloud provider: ${CLOUD_PROVIDER}. Must be one of: aws, azure, gcp" >&2
              exit 1
              ;;
          esac
          cd "${TF_ROOT}"
          echo "Initializing Terraform with ${BACKEND_TYPE} backend..."
          cp "backends/${BACKEND_TYPE}.tf" backend_override.tf
          case "${CLOUD_PROVIDER}" in
            aws)
              terraform init -reconfigure -upgrade \
                -backend-config="backends/s3.hcl" \
                -backend-config="bucket=${AWS_TF_STATE_BUCKET}" \
                -backend-config="key=kubernetes/aws/${WORKSPACE}/terraform.tfstate"
              ;;
            azure)
              terraform init -reconfigure -upgrade -backend-config="backends/azurerm.hcl"
              ;;
            gcp)
              terraform init -reconfigure -upgrade -backend-config="backends/gcs.hcl"
              ;;
          esac
          if terraform workspace list | grep -q "${WORKSPACE}"; then
            terraform workspace select "${WORKSPACE}"
          else
            terraform workspace new "${WORKSPACE}"
          fi
          echo "Current workspace: $(terraform workspace show)"
          echo "Planning infrastructure destruction (dry-run)..."
          terraform plan -destroy \
            --var-file="./tfvars_files/${WORKSPACE}.tfvars" \
            -var project_name="${PROJECT_NAMESPACE}" \
            -var gitlab_token="${GITLAB_ACCESS_TOKEN}" \
            -var gitlab_username="${GITLAB_USERNAME}"
          echo "Executing infrastructure destruction..."
          terraform destroy -auto-approve \
            --var-file="./tfvars_files/${WORKSPACE}.tfvars" \
            -var project_name="${PROJECT_NAMESPACE}" \
            -var gitlab_token="${GITLAB_ACCESS_TOKEN}" \
            -var gitlab_username="${GITLAB_USERNAME}"
          echo "Terraform destroy completed successfully."
