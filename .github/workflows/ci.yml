# =============================================================================
# ci.yml
# -----------------------------------------------------------------------------
# GitHub Actions pipeline for the Terraform bootstrap root in terraform/kubernetes.
#
# Security and static Terraform checks run on every push/PR without cloud
# credentials. Remote-backend validate/plan/apply/destroy are manual
# workflow_dispatch operations because they require cloud OIDC trust and target a
# selected cloud/environment.
#
# Required secrets/vars once cloud wiring goes live:
#   Secrets: AWS_ROLE_ARN, ARM_CLIENT_ID, ARM_TENANT_ID, ARM_SUBSCRIPTION_ID,
#            GCP_PROJECT_ID, GCP_WORKLOAD_IDENTITY_PROVIDER,
#            GCP_SERVICE_ACCOUNT_EMAIL
#   Variables or secrets: AWS_TF_STATE_BUCKET, AWS_REGION, GCP_TF_STATE_BUCKET,
#            GCP_REGION, GCP_ZONE, PROJECT_NAMESPACE
# =============================================================================

name: Kubernetes Infrastructure CI

on:
  pull_request:
    paths:
      - terraform/**
      - .checkov.yaml
      - .github/workflows/ci.yml
      - .github/actions/terraform-cloud-setup/**
  push:
    branches:
      - main
    paths:
      - terraform/**
      - .checkov.yaml
      - .github/workflows/ci.yml
      - .github/actions/terraform-cloud-setup/**
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: Cloud provider to target
        required: true
        type: choice
        default: aws
        options:
          - aws
          - azure
          - gcp
      environment_name:
        description: Terraform workspace / environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod
      action:
        description: What to do after validate+plan
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy
      confirm_destroy:
        description: Required for destroy. Type destroy-<cloud>-<environment>, for example destroy-aws-dev.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && format('{0}-{1}', inputs.cloud_provider, inputs.environment_name) || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_ROOT: terraform/kubernetes
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TERRAFORM_VERSION: "1.12.0"
  PROJECT_NAMESPACE: ${{ vars.PROJECT_NAMESPACE || 'danielgherasim-microservices' }}

jobs:
  security-scan-gate:
    name: Security scan gate
    # Pinned from main on 2026-07-10.
    uses: devdanielgherasim/micro-market-utilities/.github/workflows/security-scan-gate.yml@30fc11173bdcd8dc9d6f0291c00633005a75f2df
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    with:
      codeql-languages: actions

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Scan Terraform with Checkov
        run: |
          set -eu
          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            bridgecrew/checkov:3.3.7 \
            -d terraform/ \
            --config-file .checkov.yaml \
            --compact \
            --quiet

  terraform-validate-static:
    name: Terraform validate (static)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init without backend
        working-directory: ${{ env.TF_ROOT }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: Terraform fmt check
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -diff -recursive

  validate:
    name: Terraform validate (remote backend)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
      ENVIRONMENT: ${{ inputs.environment_name }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_TF_STATE_BUCKET: ${{ secrets.AWS_TF_STATE_BUCKET || vars.AWS_TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AZURE_TF_STATE_RESOURCE_GROUP: ${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}
      AZURE_TF_STATE_STORAGE_ACCOUNT: ${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}
      AZURE_TF_STATE_CONTAINER: ${{ vars.AZURE_TF_STATE_CONTAINER }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-central2' }}
      GCP_ZONE: ${{ vars.GCP_ZONE || 'europe-central2-a' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configure cloud provider
        id: cloud
        uses: ./.github/actions/terraform-cloud-setup
        with:
          cloud_provider: ${{ env.CLOUD_PROVIDER }}
          environment: ${{ env.ENVIRONMENT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cp "backends/${{ steps.cloud.outputs.backend_type }}.tf" backend_override.tf
          terraform init -reconfigure -upgrade ${{ steps.cloud.outputs.backend_args }}

      - name: Terraform workspace select
        working-directory: ${{ env.TF_ROOT }}
        env:
          WORKSPACE: ${{ steps.cloud.outputs.workspace }}
        run: |
          set -eu
          terraform workspace select "${WORKSPACE}" 2>/dev/null || terraform workspace new "${WORKSPACE}"
          echo "Current workspace: $(terraform workspace show)"

      - name: Terraform validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: Terraform fmt check
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -diff -recursive

  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
      ENVIRONMENT: ${{ inputs.environment_name }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_TF_STATE_BUCKET: ${{ secrets.AWS_TF_STATE_BUCKET || vars.AWS_TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AZURE_TF_STATE_RESOURCE_GROUP: ${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}
      AZURE_TF_STATE_STORAGE_ACCOUNT: ${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}
      AZURE_TF_STATE_CONTAINER: ${{ vars.AZURE_TF_STATE_CONTAINER }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-central2' }}
      GCP_ZONE: ${{ vars.GCP_ZONE || 'europe-central2-a' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configure cloud provider
        id: cloud
        uses: ./.github/actions/terraform-cloud-setup
        with:
          cloud_provider: ${{ env.CLOUD_PROVIDER }}
          environment: ${{ env.ENVIRONMENT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cp "backends/${{ steps.cloud.outputs.backend_type }}.tf" backend_override.tf
          terraform init -reconfigure -upgrade ${{ steps.cloud.outputs.backend_args }}

      - name: Terraform workspace select
        working-directory: ${{ env.TF_ROOT }}
        env:
          WORKSPACE: ${{ steps.cloud.outputs.workspace }}
        run: |
          set -eu
          terraform workspace select "${WORKSPACE}" 2>/dev/null || terraform workspace new "${WORKSPACE}"
          echo "Current workspace: $(terraform workspace show)"

      - name: Terraform plan
        working-directory: ${{ env.TF_ROOT }}
        run: |
          set -eu
          terraform plan \
            --var-file="./tfvars_files/${ENVIRONMENT}.tfvars" \
            -var project_name="${PROJECT_NAMESPACE}" \
            -out=tfplan
          terraform show -json tfplan > plan.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tfplan-${{ inputs.cloud_provider }}-${{ inputs.environment_name }}
          path: |
            ${{ env.TF_ROOT }}/tfplan
            ${{ env.TF_ROOT }}/plan.json
          retention-days: 7
          if-no-files-found: error

  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
    needs: plan
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
      ENVIRONMENT: ${{ inputs.environment_name }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_TF_STATE_BUCKET: ${{ secrets.AWS_TF_STATE_BUCKET || vars.AWS_TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AZURE_TF_STATE_RESOURCE_GROUP: ${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}
      AZURE_TF_STATE_STORAGE_ACCOUNT: ${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}
      AZURE_TF_STATE_CONTAINER: ${{ vars.AZURE_TF_STATE_CONTAINER }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-central2' }}
      GCP_ZONE: ${{ vars.GCP_ZONE || 'europe-central2-a' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configure cloud provider
        id: cloud
        uses: ./.github/actions/terraform-cloud-setup
        with:
          cloud_provider: ${{ env.CLOUD_PROVIDER }}
          environment: ${{ env.ENVIRONMENT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tfplan-${{ inputs.cloud_provider }}-${{ inputs.environment_name }}
          path: ${{ env.TF_ROOT }}

      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cp "backends/${{ steps.cloud.outputs.backend_type }}.tf" backend_override.tf
          terraform init -reconfigure -upgrade ${{ steps.cloud.outputs.backend_args }}

      - name: Terraform workspace select
        working-directory: ${{ env.TF_ROOT }}
        env:
          WORKSPACE: ${{ steps.cloud.outputs.workspace }}
        run: |
          set -eu
          terraform workspace select "${WORKSPACE}"
          echo "Current workspace: $(terraform workspace show)"

      - name: Terraform apply
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -auto-approve tfplan

  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && inputs.confirm_destroy == format('destroy-{0}-{1}', inputs.cloud_provider, inputs.environment_name)
    needs: validate
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
      id-token: write
    env:
      CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
      ENVIRONMENT: ${{ inputs.environment_name }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      AWS_TF_STATE_BUCKET: ${{ secrets.AWS_TF_STATE_BUCKET || vars.AWS_TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      AZURE_TF_STATE_RESOURCE_GROUP: ${{ vars.AZURE_TF_STATE_RESOURCE_GROUP }}
      AZURE_TF_STATE_STORAGE_ACCOUNT: ${{ vars.AZURE_TF_STATE_STORAGE_ACCOUNT }}
      AZURE_TF_STATE_CONTAINER: ${{ vars.AZURE_TF_STATE_CONTAINER }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
      GCP_TF_STATE_BUCKET: ${{ vars.GCP_TF_STATE_BUCKET }}
      GCP_REGION: ${{ vars.GCP_REGION || 'europe-central2' }}
      GCP_ZONE: ${{ vars.GCP_ZONE || 'europe-central2-a' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Configure cloud provider
        id: cloud
        uses: ./.github/actions/terraform-cloud-setup
        with:
          cloud_provider: ${{ env.CLOUD_PROVIDER }}
          environment: ${{ env.ENVIRONMENT }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          cp "backends/${{ steps.cloud.outputs.backend_type }}.tf" backend_override.tf
          terraform init -reconfigure -upgrade ${{ steps.cloud.outputs.backend_args }}

      - name: Terraform workspace select
        working-directory: ${{ env.TF_ROOT }}
        env:
          WORKSPACE: ${{ steps.cloud.outputs.workspace }}
        run: |
          set -eu
          terraform workspace select "${WORKSPACE}"
          echo "Current workspace: $(terraform workspace show)"

      - name: Terraform destroy
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform destroy -auto-approve \
            --var-file="./tfvars_files/${ENVIRONMENT}.tfvars" \
            -var project_name="${PROJECT_NAMESPACE}"
