prometheus:
  prometheusSpec:
    retention: "15d"
    evaluationInterval: "30s"
    scrapeInterval: "30s"
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    walCompression: true
    enableAdminAPI: false
    externalUrl: /prometheus
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "managed-csi"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
    resources:
      requests:
        memory: "256Mi"
        cpu: "200m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    replicas: 1
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - prometheus
              topologyKey: kubernetes.io/hostname

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "managed-csi"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    replicas: 2
    retention: 120h
    podAntiAffinity: "soft"
    externalUrl: "https://${DOMAIN}/alertmanager"
  configSecret: "alertmanager-config"
  configFileName: "alertmanager.yaml"

grafana:
  replicas: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  sidecar:
    dashboards:
      enabled: true
      skipTlsVerify: true
      searchNamespace: ALL
      provider:
        disableDelete: false
    datasources:
      enabled: true
      skipTlsVerify: true
      searchNamespace: ALL

  # Simplified readiness and liveness probes
  readinessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 30
    failureThreshold: 10
    periodSeconds: 10

  livenessProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 60
    timeoutSeconds: 30
    failureThreshold: 10
    periodSeconds: 10

  startupProbe:
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 120
    timeoutSeconds: 30
    failureThreshold: 30
    periodSeconds: 10

  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - grafana
            topologyKey: kubernetes.io/hostname

  # Main Grafana configuration
  grafana.ini:
    server:
      serve_from_sub_path: true
      domain: ${DOMAIN}
      root_url: https://${DOMAIN}/grafana

    auth:
      disable_login_form: false
      oauth_auto_login: false
      login_maximum_inactive_lifetime_duration: 7d
      login_maximum_lifetime_duration: 30d

    security:
      cookie_secure: true
      disable_gravatar: true
      content_security_policy: true
      strict_transport_security: true
      strict_transport_security_max_age_seconds: 31536000
      strict_transport_security_preload: true
      strict_transport_security_subdomains: true
      x_content_type_options: true
      x_xss_protection: true

    users:
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: Viewer

    analytics:
      reporting_enabled: false
      check_for_updates: false

    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      client_secret: ${GRAFANA_OIDC_CLIENT_SECRET}
      scopes: openid profile email
      auth_url: https://${DOMAIN}/auth/realms/microservices/protocol/openid-connect/auth
      token_url: https://${DOMAIN}/auth/realms/microservices/protocol/openid-connect/token
      api_url: https://${DOMAIN}/auth/realms/microservices/protocol/openid-connect/userinfo
      role_attribute_path: contains(roles[*], 'admin') && 'Admin' || contains(roles[*], 'editor') && 'Editor' || 'Viewer'

    # Unified alerting configuration
    unified_alerting:
      enabled: true
      alertmanagers:
        alertmanager:
          name: AlertManager
          type: alertmanager
          uid: alertmanager
          url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
          access: proxy
          implementation: prometheus
          handleGrafanaManagedAlerts: true

    # Disable legacy alerting
    alerting:
      enabled: false

    alerting_ui:
      views:
        rules:
          folders: "folder"

    metrics:
      enabled: true

    database:
      wal: true

    log:
      mode: console
      level: info

    smtp:
      enabled: true
      host: smtp.gmail.com:587
      user: alertmanager@monitoring.local
      from_address: alertmanager@monitoring.local
      from_name: Grafana Alert
      startTLS_policy: MandatoryStartTLS

  # Persistence configuration
  persistence:
    enabled: true
    storageClassName: "managed-csi"
    size: 5Gi

  # Data sources configuration
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Alertmanager
          type: alertmanager
          url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
          access: proxy
          isDefault: false
          uid: alertmanager
          jsonData:
            implementation: prometheus
            handleGrafanaManagedAlerts: true
            manageAlerts: true
        - name: Loki
          type: loki
          url: http://loki-gateway.monitoring.svc.cluster.local/loki
          access: proxy
          isDefault: true
          uid: Loki
          jsonData:
            timeout: 30
            maxLines: 1000
            alerting: true
            manageAlerts: true
            derivedFields:
              - datasourceUid: Loki
                matcherRegex: traceID=(\w+)
                name: TraceID
                url: https://${DOMAIN}/grafana/explore?orgId=1&left=%5B%22now-1h%22,%22now%22,%22Loki%22,%7B%22expr%22:%22%7Btracing%7D%20|%20json%20|%20traceID%3D%5C%22$$value%5C%22%22%7D%5D
          basicAuth: true
          basicAuthUser: promtail

  # Dashboard providers configuration
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'monitoring'
          orgId: 1
          folder: 'Monitoring'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/monitoring

  # Alertmanager configuration
  alerting:
    alertmanagers:
      alertmanager:
        name: AlertManager
        orgId: 1
        type: prometheus
        uid: alertmanager
        url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
        access: proxy
        handleGrafanaManagedAlerts: true
        implementation: prometheus

  # Provisioning configuration
  provisioning:
    alerting:
      rules_dir: /etc/grafana/provisioning/alerting/rules
      contactpoints_dir: /etc/grafana/provisioning/alerting/contactpoints

  # Volume configurations
  extraVolumeMounts:
    - name: grafana-alert-rules
      mountPath: /etc/grafana/provisioning/alerting/rules
    - name: grafana-contact-points
      mountPath: /etc/grafana/provisioning/alerting/contactpoints

  extraVolumes:
    - name: grafana-alert-rules
      configMap:
        name: grafana-alert-rules
    - name: grafana-contact-points
      configMap:
        name: grafana-contact-points

  # Dashboards configuration
  dashboards:
    default:
      loki-logs:
        file: /var/lib/grafana/dashboards/default/loki-logs.json
    monitoring:
      k8s-views-global:
        gnetId: 15757
        revision: 43
        datasource: Prometheus
      loki:
        gnetId: 13639
        revision: 2
        datasource: Loki
      keycloak:
        gnetId: 10441
        revision: 2
        datasource: Prometheus
      prometheus-stats:
        gnetId: 15760
        revision: 36
        datasource: Prometheus
      cert-manager:
        gnetId: 11001
        revision: 1
        datasource: Prometheus
      alert-manager:
        gnetId: 9578
        revision: 4
        datasource: Prometheus
      postgres:
        gnetId: 9628
        revision: 8
        datasource: Prometheus
      coredns:
        gnetId: 14981
        revision: 2
        datasource: Prometheus
      persistent-volumes:
        gnetId: 20066
        revision: 2
        datasource: Prometheus

defaultRules:
  create: true
  rules:
    alertmanager: true
    general: true
    k8s: true
    kubeApiserver: true
    kubernetesApps: true
    kubernetesResources: true
    node: true
    prometheus: true
  disabled:
    KubeControllerManagerDown: true
    KubeSchedulerDown: true

nodeExporter:
  enabled: true
  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"

prometheusOperator:
  enabled: true
  manageCrds: true
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
