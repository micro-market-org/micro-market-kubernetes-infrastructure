apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: microservices
  namespace: argocd
spec:
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: prod
                  provider: aws
                  domain: danielgherasim.com
          - list:
              elements:
                - name: catalog
                  path: catalog
                  imageRepository: REPLACE_WITH_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/danielgherasim-microservices/prod/catalog
                - name: audit
                  path: audit
                  imageRepository: REPLACE_WITH_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/danielgherasim-microservices/prod/audit
                - name: orders
                  path: orders
                  imageRepository: REPLACE_WITH_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/danielgherasim-microservices/prod/orders
                - name: micro-market-frontend
                  path: micro-market-frontend
                  imageRepository: REPLACE_WITH_AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com/danielgherasim-microservices/prod/micro-market-frontend
  template:
    metadata:
      name: '{{name}}'
      namespace: argocd
      labels:
        environment: '{{env}}'
        provider: '{{provider}}'
    spec:
      project: microservices
      source:
        repoURL: https://gitlab.com/microservices1691715/deployment.git
        targetRevision: HEAD
        path: '{{path}}'
        helm:
          valueFiles:
            - values.yaml
            - environments/{{env}}-values.yaml
          parameters:
            - name: global.environment
              value: '{{env}}'
            - name: image.repository
              value: '{{imageRepository}}'
            - name: global.domain
              value: '{{domain}}'
            - name: ingress.hosts[0].host
              value: '{{domain}}'
            - name: ingress.tls[0].hosts[0]
              value: '{{domain}}'
            - name: configMaps.micro-market-frontend-config.data.NEXT_PUBLIC_KEYCLOAK_URL
              value: 'https://{{domain}}/auth'
            - name: configMaps.micro-market-frontend-config.data.NEXT_PUBLIC_API_URL
              value: 'https://{{domain}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'microservices'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
