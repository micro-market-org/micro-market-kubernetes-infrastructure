config:
  clients:
    - url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push

  snippets:
    pipelineStages:
      - cri: { }
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            logger: logger
            thread: thread
            service: service
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: message

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 15s

resources:
  requests:
    cpu: 50m
    memory: 64Mi

tolerations:
  - effect: NoSchedule
    operator: Exists

extraArgs:
  - -config.expand-env=true

extraEnv:
  - name: HOSTNAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName

serviceAccount:
  create: true
  name: promtail

namespaceSelectorStrategy: selection
namespaceSelector:
  matchNames:
    - microservices
    - monitoring