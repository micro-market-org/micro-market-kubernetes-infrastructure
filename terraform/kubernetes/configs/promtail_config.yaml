config:
  clients:
    - url: http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push
      tenant_id: "promtail"
      batchwait: 2s  # Increased to allow more batching
      batchsize: 65536  # Reduced to 64KB to match Loki's max_line_size
      backoff_config:
        min_period: 1s  # Increased for more stability
        max_period: 2m  # Increased to allow more time for recovery
        max_retries: 10  # Increased to allow more retries
      timeout: 10s  # Increased to match Loki's probe timeouts
      external_labels:
        cluster: ${CLUSTER_NAME}
        environment: ${CLUSTER_NAME}
      basic_auth:
        username: "promtail"
        password: "${LOKI_PASSWORD}"

  snippets:
    pipelineStages:
      - cri: 
          max_partial_lines: 25  # Further reduced from 50 to 25
          max_partial_line_size: 64000  # Further reduced from 128000 to 64000
      # Enhanced JSON parsing to handle structured metadata
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
            service: service
            metadata: metadata
            structured_metadata: structured_metadata
          drop_malformed: false  # Don't drop logs with malformed JSON
          keep_empty: true       # Keep empty values instead of dropping them
      # Process structured metadata if present - ensure it's a valid JSON object
      - template:
          source: structured_metadata
          template: '{{ if . }}{{ . }}{{ else }}{}{{ end }}'
      # Add a stage to explicitly handle empty or null metadata
      - template:
          source: metadata
          template: '{{ if . }}{{ . }}{{ else }}{}{{ end }}'
      # Convert structured metadata to a properly formatted JSON string
      - template:
          source: structured_metadata
          template: '{{ toJson . }}'
      # Only keep essential labels
      - labels:
          level:
          service:
      # Keep timestamp parsing
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - Unix
      # Removed metrics collection to reduce overhead
      # Simplified output
      - output:
          source: message

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 10s
  scrapeTimeout: 5s
  relabelings:
    - sourceLabels: [__meta_kubernetes_pod_node_name]
      targetLabel: node_name
    - sourceLabels: [__meta_kubernetes_namespace]
      targetLabel: namespace

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

readinessProbe:
  httpGet:
    path: /ready
    port: http-metrics
  initialDelaySeconds: 10
  timeoutSeconds: 5

livenessProbe:
  httpGet:
    path: /ready
    port: http-metrics
  initialDelaySeconds: 45
  timeoutSeconds: 5

tolerations:
  - effect: NoSchedule
    operator: Exists
  - key: "node-role.kubernetes.io/master"
    operator: "Exists"
    effect: "NoSchedule"

extraEnv:
  - name: HOSTNAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: CLUSTER_NAME
    valueFrom:
      fieldRef:
        fieldPath: metadata.namespace

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3101"

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

serviceAccount:
  create: true
  name: promtail
  annotations:
    prometheus.io/scrape: "true"

namespaceSelectorStrategy: any
namespaceSelector: {}
# Comment: Changed to collect logs from all namespaces instead of specific ones

securityContext:
  readOnlyRootFilesystem: true
  runAsGroup: 1000
  runAsUser: 1000

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/os
          operator: In
          values:
          - linux
