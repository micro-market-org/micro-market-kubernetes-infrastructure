global:
  resolve_timeout: 5m
  smtp_from: "alertmanager@monitoring.local"
  smtp_smarthost: "smtp.gmail.com:587"
  smtp_require_tls: true
  smtp_auth_username: "alertmanager@monitoring.local"
  smtp_auth_password: "${SMTP_AUTH_PASSWORD}"

route:
  group_by: ['alertname', 'job', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'email-notifications'
  routes:
    - match:
        severity: critical
      receiver: 'all-notifications'
      continue: true
    - match:
        severity: warning
      receiver: 'all-notifications'
      group_wait: 1m
      continue: true
    - match:
        severity: info
      receiver: 'email-notifications'
      group_wait: 2m
      continue: true
    # Route for Grafana managed alerts
    - match:
        alertname: GrafanaAlert
      receiver: 'grafana-notifications'
      continue: true
    # Route for Loki alerts
    - match_re:
        alertname: Loki.*
      receiver: 'loki-notifications'
      continue: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'namespace']
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'namespace']

receivers:
  - name: 'email-notifications'
    email_configs:
      - to: 'daniel-adrian.gherasim@student.tuiasi.ro'
        send_resolved: true
        html: |
          {{ if eq .Status "firing" }}
            <h1>🔥 {{ .Alerts.Firing | len }} Alert{{ if gt (len .Alerts.Firing) 1 }}s{{ end }} Firing</h1>
          {{ end }}
          {{ if eq .Status "resolved" }}
            <h1>✅ {{ .Alerts.Resolved | len }} Alert{{ if gt (len .Alerts.Resolved) 1 }}s{{ end }} Resolved</h1>
          {{ end }}

          <table>
            <tr><th>Alert</th><th>Summary</th><th>Description</th><th>Severity</th></tr>
            {{ range .Alerts }}
              <tr>
                <td>{{ .Labels.alertname }}</td>
                <td>{{ .Annotations.summary }}</td>
                <td>{{ .Annotations.description }}</td>
                <td>{{ .Labels.severity }}</td>
              </tr>
            {{ end }}
          </table>

  - name: 'slack-notifications'
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }}
            *Details:*
            {{ range .Labels.SortedPairs }} • *{{ .Name }}:* `{{ .Value }}`
            {{ end }}
          {{ end }}

  - name: 'all-notifications'
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
