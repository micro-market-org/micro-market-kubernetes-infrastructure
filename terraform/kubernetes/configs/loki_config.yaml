loki:
  auth_enabled: false
  storage:
    type: filesystem
  storage_config:
    filesystem:
      directory: /var/loki/chunks
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
  compactor:
    shared_store: filesystem
    working_directory: /var/loki/compactor
  limits_config:
    retention_period: 7d
  ruler:
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    rule_path: /tmp/loki/rules-temp
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
    ring:
      kvstore:
        store: inmemory
    enable_api: true

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  extraVolumeMounts:
    - name: storage
      mountPath: /var/loki/chunks
    - name: storage
      mountPath: /var/loki/compactor

monitoring:
  selfMonitoring:
    enabled: true
    grafanaAgent:
      installOperator: false

serviceAccount:
  create: true
  name: loki

persistence:
  enabled: true
  storageClassName: "managed-csi"
  size: 5Gi

service:
  type: ClusterIP

gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
