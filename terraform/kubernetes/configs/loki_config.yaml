deploymentMode: "SingleBinary<->SimpleScalable"

loki:
  auth_enabled: true
  extraArgs:
    - "-config.expand-env=true"
  storage:
    type: filesystem
  schema_config:
    configs:
      - from: "2023-01-01"
        store: boltdb-shipper
        object_store: filesystem
        schema: v12
        index:
          prefix: index_
          period: 24h
  storage_config:
    boltdb_shipper:
      active_index_directory: /var/loki/index
      cache_location: /var/loki/cache
      cache_ttl: 24h
      resync_interval: 5m
    filesystem:
      directory: /var/loki/chunks
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 5m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150
    delete_request_store: "filesystem"
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
    ring:
      kvstore:
        store: inmemory
  limits_config:
    retention_period: 15d
    reject_old_samples: true
    reject_old_samples_max_age: 168h  # 7d
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    per_stream_rate_limit: 5MB
    per_stream_rate_limit_burst: 10MB
    max_entries_limit_per_query: 10000
    max_query_series: 1000
    max_query_lookback: 168h  # 7d
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    cardinality_limit: 100000
    max_chunks_per_query: 2000000
    max_global_streams_per_user: 10000
    max_line_size: 256000
    max_label_names_per_series: 30
  chunk_store_config:
    max_look_back_period: 336h  # 14d
  table_manager:
    retention_deletes_enabled: true
    retention_period: 336h  # 14d
  frontend:
    compress_responses: true
    log_queries_longer_than: 10s
    downstream_url: http://localhost:3100
    scheduler_address: localhost:9095
  frontend_worker:
    scheduler_address: localhost:9095
  query_range:
    align_queries_with_step: true
    cache_results: true
    results_cache:
      cache:
        enable_fifocache: true
        fifocache:
          max_size_items: 1024
          validity: 24h
  ruler:
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    rule_path: /tmp/loki/rules-temp
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
    ring:
      kvstore:
        store: inmemory
    enable_api: true
    enable_alertmanager_v2: true
    evaluation_interval: 1m

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClassName: managed-csi
    size: 10Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  securityContext:
    fsGroup: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
  initContainers:
    - name: init-directories
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - "mkdir -p /var/loki/index /var/loki/chunks /var/loki/compactor /var/loki/cache /var/loki/delete-requests"
      volumeMounts:
        - name: storage
          mountPath: /var/loki
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
  readinessProbe:
    httpGet:
      path: /ready
      port: 3100
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /ready
      port: 3100
    initialDelaySeconds: 300
    timeoutSeconds: 5
    periodSeconds: 30
    successThreshold: 1
    failureThreshold: 3

  startupProbe:
    httpGet:
      path: /ready
      port: 3100
    initialDelaySeconds: 60
    timeoutSeconds: 5
    periodSeconds: 15
    successThreshold: 1
    failureThreshold: 10

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app
              operator: In
              values:
              - loki
          topologyKey: kubernetes.io/hostname

monitoring:
  selfMonitoring:
    enabled: true
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_name]
        targetLabel: pod
      - sourceLabels: [__meta_kubernetes_namespace]
        targetLabel: namespace
  dashboards:
    enabled: true
    labels:
      grafana_dashboard: "1"

serviceAccount:
  create: true
  name: loki
  annotations:
    prometheus.io/scrape: "true"

service:
  type: ClusterIP
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"

gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  readinessProbe:
    httpGet:
      path: /
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 15
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  ingress:
    enabled: false
  basicAuth:
    enabled: false
  nginxConfig:
    customConfig: |
      worker_processes  auto;
      error_log  /dev/stderr;
      pid        /tmp/nginx.pid;
      worker_rlimit_nofile 8192;

      events {
        worker_connections  4096;
      }

      http {
        client_max_body_size 5M;
        default_type application/octet-stream;
        log_format   main '$remote_addr - $remote_user [$time_local]  $status '
          '"$request" $body_bytes_sent "$http_referer" '
          '"$http_user_agent" "$http_x_forwarded_for"';
        access_log   /dev/stderr  main;
        sendfile     on;
        tcp_nopush   on;
        resolver kube-dns.kube-system.svc.cluster.local;

        server {
          listen             8080;

          location = / {
            return 200 'OK';
            auth_basic off;
          }

          location = /ready {
            return 200 'Ready';
            auth_basic off;
          }

          location = /metrics {
            proxy_pass       http://localhost:3100/metrics;
            auth_basic off;
          }

          location ~ /api/prom/.* {
            proxy_pass       http://localhost:3100$request_uri;
          }

          location ~ /prometheus/.* {
            proxy_pass       http://localhost:3100$request_uri;
          }

          location ~ /loki/api/.* {
            proxy_pass       http://localhost:3100$request_uri;
          }

          location ~ /api/v1/push {
            proxy_pass       http://localhost:3100$request_uri;
          }
        }
      }
