deploymentMode: "SingleBinary"

# Disable all SimpleScalable components
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Disable caches to simplify configuration and reduce resource contention
chunksCache:
  enabled: false
resultsCache:
  enabled: false

loki:
  auth_enabled: true
  extraArgs:
    - "-config.expand-env=true"
  # No memberlist configuration needed for SingleBinary mode
  storage:
    type: filesystem
  schema_config:
    configs:
      - from: "2023-01-01"
        store: boltdb-shipper
        object_store: filesystem
        schema: v12
        index:
          prefix: index_
          period: 24h
  storage_config:
    boltdb_shipper:
      active_index_directory: /var/loki/index
      cache_location: /var/loki/cache
      cache_ttl: 24h
      resync_interval: 5m
    filesystem:
      directory: /var/loki/chunks
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 50
    delete_request_store: "filesystem"
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
    ring:
      kvstore:
        store: inmemory
  limits_config:
    retention_period: 3d
    reject_old_samples: true
    reject_old_samples_max_age: 72h  # 3d
    ingestion_rate_mb: 4
    ingestion_burst_size_mb: 8
    per_stream_rate_limit: 2MB
    per_stream_rate_limit_burst: 4MB
    max_entries_limit_per_query: 500
    max_query_series: 50
    max_query_lookback: 72h  # 3d
    max_cache_freshness_per_query: 5m
    split_queries_by_interval: 15m
    cardinality_limit: 1000
    max_chunks_per_query: 100000
    max_global_streams_per_user: 500
    max_line_size: 64000  # Increased to match Promtail's max_partial_line_size
    max_label_names_per_series: 20  # Set to match monitoring.tf
    unordered_writes: true  # Enable unordered writes to better handle metadata
    creation_grace_period: 10m  # Add grace period for log creation time
  chunk_store_config:
    max_look_back_period: 72h  # 3d
  table_manager:
    retention_deletes_enabled: true
    retention_period: 72h  # 3d
  frontend:
    compress_responses: true
    log_queries_longer_than: 10s
    downstream_url: http://localhost:3100
    scheduler_address: localhost:9095
  frontend_worker:
    scheduler_address: localhost:9095
  query_range:
    align_queries_with_step: true
    cache_results: false
  ruler:
    storage:
      type: local
      local:
        directory: /etc/loki/rules
    rule_path: /tmp/loki/rules-temp
    alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
    ring:
      kvstore:
        store: inmemory
    enable_api: true
    enable_alertmanager_v2: true
    evaluation_interval: 1m

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClassName: managed-csi
    size: 3Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 200m  # Increased from 50m to 200m to ensure stability
      memory: 512Mi  # Increased from 128Mi to 512Mi to prevent OOM issues
    limits:
      cpu: 500m  # Increased from 200m to 500m to allow for spikes
      memory: 1Gi  # Increased from 256Mi to 1Gi to prevent OOM issues
  securityContext:
    fsGroup: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
  initContainers:
    - name: init-directories
      image: busybox:1.36.1
      command:
        - sh
        - -c
        - "mkdir -p /var/loki/index /var/loki/chunks /var/loki/compactor /var/loki/cache /var/loki/delete-requests"
      volumeMounts:
        - name: storage
          mountPath: /var/loki
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
  # Optimized probe configuration with very generous timeouts
  readinessProbe:
    httpGet:
      path: /ready
      port: 3100
    initialDelaySeconds: 60  # Increased from 30s to 60s
    timeoutSeconds: 10       # Increased from 5s to 10s
    periodSeconds: 30        # Increased from 15s to 30s
    successThreshold: 1
    failureThreshold: 5      # Increased from 3 to 5
  livenessProbe:
    httpGet:
      path: /ready
      port: 3100
    initialDelaySeconds: 300  # Increased from 180s to 300s
    timeoutSeconds: 10        # Increased from 5s to 10s
    periodSeconds: 60         # Increased from 30s to 60s
    successThreshold: 1
    failureThreshold: 5       # Increased from 3 to 5

  startupProbe:
    httpGet:
      path: /ready
      port: 3100
    initialDelaySeconds: 120  # Increased from 60s to 120s
    timeoutSeconds: 10        # Increased from 5s to 10s
    periodSeconds: 30         # Increased from 15s to 30s
    successThreshold: 1
    failureThreshold: 40      # Increased from 30 to 40

  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app
              operator: In
              values:
              - loki
          topologyKey: kubernetes.io/hostname

monitoring:
  selfMonitoring:
    enabled: true
    grafanaAgent:
      installOperator: false
    tenantID: "promtail"
    lokiAddress: "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
    basicAuth:
      username: "promtail"
      password: "${LOKI_PASSWORD}"
  lokiCanary:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  serviceMonitor:
    enabled: true
    interval: 15s
    scrapeTimeout: 10s
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_name]
        targetLabel: pod
      - sourceLabels: [__meta_kubernetes_namespace]
        targetLabel: namespace
  dashboards:
    enabled: true
    labels:
      grafana_dashboard: "1"

serviceAccount:
  create: true
  name: loki
  annotations:
    prometheus.io/scrape: "true"

service:
  type: ClusterIP
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"

gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  readinessProbe:
    httpGet:
      path: /
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 15
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  livenessProbe:
    httpGet:
      path: /
      port: 8080
      scheme: HTTP
    initialDelaySeconds: 30
    timeoutSeconds: 5
    periodSeconds: 10
    successThreshold: 1
    failureThreshold: 3
  ingress:
    enabled: true
    pathType: Prefix
  basicAuth:
    enabled: false
  nginxConfig:
    customConfig: |
      worker_processes  auto;
      error_log  /dev/stderr;
      pid        /tmp/nginx.pid;
      worker_rlimit_nofile 8192;

      events {
        worker_connections  4096;
      }

      http {
        client_max_body_size 5M;
        default_type application/octet-stream;
        log_format   main '$remote_addr - $remote_user [$time_local]  $status '
          '"$request" $body_bytes_sent "$http_referer" '
          '"$http_user_agent" "$http_x_forwarded_for"';
        access_log   /dev/stderr  main;
        sendfile     on;
        tcp_nopush   on;
        resolver kube-dns.kube-system.svc.cluster.local;

        server {
          listen             8080;

          location = / {
            return 200 'OK';
            auth_basic off;
          }

          location = /ready {
            return 200 'Ready';
            auth_basic off;
          }

          location = /metrics {
            proxy_pass       http://localhost:3100/metrics;
            auth_basic off;
          }

          location ~ /api/prom/.* {
            proxy_pass       http://localhost:3100$request_uri;
          }

          location ~ /prometheus/.* {
            proxy_pass       http://localhost:3100$request_uri;
          }

          location ~ /loki/api/.* {
            proxy_pass       http://localhost:3100$request_uri;
          }

          location ~ /api/v1/.* {
            proxy_pass       http://localhost:3100$request_uri;
          }

          # Explicitly add ruler API endpoints
          location ~ /ruler/.* {
            proxy_pass       http://localhost:3100$request_uri;
          }

          location ~ /loki/api/v1/rules/.* {
            proxy_pass       http://localhost:3100$request_uri;
          }

          location ~ /api/prom/rules/.* {
            proxy_pass       http://localhost:3100$request_uri;
          }
        }
      }
