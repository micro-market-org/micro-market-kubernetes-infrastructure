image: registry.gitlab.com/gitlab-org/terraform-images/stable:latest

stages:
  - validate
  - plan
  - apply
  - destroy

variables:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_PLUGIN_CACHE_DIR: "$CI_PROJECT_DIR/.terraform.d/plugin-cache"
  CLOUD_PROVIDER: ${CLOUD_PROVIDER:-azure}
  TF_ROOT: terraform/kubernetes
  WORKSPACE: ${CI_COMMIT_REF_NAME}

# Reusable components
.terraform-cache: &terraform-cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}-${CLOUD_PROVIDER}
    paths:
      - ${TF_ROOT}/.terraform
      - .terraform.d/plugin-cache
    policy: pull-push

.configure-environment: &configure-environment
  - mkdir -p $TF_PLUGIN_CACHE_DIR
  - |
    WORKSPACE=$(echo ${WORKSPACE} | tr -cd '[:alnum:]-' | tr '[:upper:]' '[:lower:]')
    echo "Using workspace: $WORKSPACE"
    
    case "${CLOUD_PROVIDER}" in
      aws)
        export TF_VAR_aws_access_key=$AWS_ACCESS_KEY_ID
        export TF_VAR_aws_secret_key=$AWS_SECRET_ACCESS_KEY
        export TF_VAR_aws_session_token=$AWS_SESSION_TOKEN
        export TF_VAR_aws_region=${AWS_REGION:-us-east-1}
        export TF_VAR_cloud_provider="aws"
        export BACKEND_TYPE="s3"
        export BACKEND_CONFIG="-backend-config=\"bucket=terraform-microservices1691715-state\" \
          -backend-config=\"key=terraform.tfstate\" \
          -backend-config=\"region=${TF_VAR_aws_region}\" \
          -backend-config=\"access_key=${TF_VAR_aws_access_key}\" \
          -backend-config=\"secret_key=${TF_VAR_aws_secret_key}\" \
          -backend-config=\"token=${TF_VAR_aws_session_token}\""
        ;;
      azure)
        export TF_VAR_client_id=$ARM_CLIENT_ID
        export TF_VAR_client_secret=$ARM_CLIENT_SECRET
        export TF_VAR_tenant_id=$ARM_TENANT_ID
        export TF_VAR_subscription_id=$ARM_SUBSCRIPTION_ID
        export TF_VAR_cloud_provider="azure"
        export BACKEND_TYPE="azurerm"
        export BACKEND_CONFIG="-backend-config=\"resource_group_name=rg-infrastructure\" \
          -backend-config=\"storage_account_name=terraformmicrostate\" \
          -backend-config=\"container_name=tfstate\" \
          -backend-config=\"key=kubernetes.tfstate\""
        ;;
      gcp)
        echo "$GCP_SERVICE_ACCOUNT_KEY" > gcp-credentials.json
        export GOOGLE_APPLICATION_CREDENTIALS="$CI_PROJECT_DIR/gcp-credentials.json"
        export TF_VAR_gcp_credentials="$CI_PROJECT_DIR/gcp-credentials.json"
        export TF_VAR_gcp_project=$GCP_PROJECT_ID
        export TF_VAR_gcp_region=${GCP_REGION:-europe-central2}
        export TF_VAR_gcp_zone=${GCP_ZONE:-europe-central2-a}
        export TF_VAR_cloud_provider="gcp"
        export BACKEND_TYPE="gcs"
        export BACKEND_CONFIG="-backend-config=\"bucket=terraformmicroservicesstate\" \
          -backend-config=\"prefix=kubernetes/state\" \
          -backend-config=\"credentials=${TF_VAR_gcp_credentials}\""
        ;;
      *)
        echo "ERROR: Unsupported cloud provider: ${CLOUD_PROVIDER}. Must be one of: aws, azure, gcp"
        exit 1
        ;;
    esac

.initialize-terraform: &initialize-terraform
  - cd ${TF_ROOT}
  - sed -i "s/BACKEND_PLACEHOLDER/${BACKEND_TYPE}/g" main.tf
  - echo "Initializing Terraform with ${BACKEND_TYPE} backend..."
  - eval terraform init ${BACKEND_CONFIG}
  - |
    # Setup workspace
    if ! terraform workspace list | grep -q "$WORKSPACE"; then
      echo "Creating new workspace: $WORKSPACE"
      terraform workspace new "$WORKSPACE"
    else
      echo "Selecting existing workspace: $WORKSPACE"
      terraform workspace select "$WORKSPACE"
    fi
    echo "Current workspace: $(terraform workspace show)"

.post-apply-azure: &post-apply-azure
  - |
    if [ "${CLOUD_PROVIDER}" = "azure" ]; then
      echo "Configuring Azure AKS post-deployment..."
      az login --service-principal -u $ARM_CLIENT_ID -p $ARM_CLIENT_SECRET --tenant $ARM_TENANT_ID
      az aks get-credentials --resource-group rg-$PROJECT_NAMESPACE-$WORKSPACE-aks --name aks-$PROJECT_NAMESPACE-$WORKSPACE
    
      kubectl apply -f ./configs/production_issuer.yaml
      kubectl apply -f ./configs/argocd_network_policies.yaml
      kubectl apply -f ./configs/prometheus_recording_rules.yaml
      kubectl apply -f ./configs/prometheus_alerting_rules.yaml
      kubectl apply -f ./configs/argocd_project.yaml
    
      cat ./configs/argocd_application.yaml.template | \
        sed "s/\${ENV}/$WORKSPACE/g" | \
        sed "s/\${REGISTRY}/$CONTAINER_REGISTRY_NAME/g" | \
        sed "s/\${PROJECT_NAME}/$PROJECT_NAMESPACE/g" | \
        sed "s/\${PROVIDER}/$CLOUD_PROVIDER/g" > ./configs/argocd_application.yaml
    
      kubectl apply -f ./configs/argocd_application.yaml
    
      PUBLIC_IP_NAME=$(az network public-ip list --resource-group rg-$PROJECT_NAMESPACE-$WORKSPACE-aks --query "[?contains(name, 'kubernetes-')].name" -o tsv)
      az network public-ip update --resource-group rg-$PROJECT_NAMESPACE-$WORKSPACE-aks --name $PUBLIC_IP_NAME --dns-name $PROJECT_NAMESPACE
    
      echo "Azure AKS post-deployment configuration completed successfully."
    fi

validate:
  stage: validate
  <<: *terraform-cache
  before_script:
    - *configure-environment
    - *initialize-terraform
  script:
    - echo "Validating Terraform configuration..."
    - terraform validate
    - terraform fmt -check -diff -recursive
    - echo "Terraform validation completed successfully."

plan:
  stage: plan
  <<: *terraform-cache
  before_script:
    - *configure-environment
    - *initialize-terraform
  script:
    - echo "Planning Terraform infrastructure changes..."
    - terraform plan --var-file=./tfvars_files/$WORKSPACE.tfvars -var project_name="$PROJECT_NAMESPACE" -var gitlab_token="$GITLAB_ACCESS_TOKEN" -var gitlab_username="$GITLAB_USERNAME" -out=tfplan
    - terraform show -json tfplan > plan.json
    - echo "Terraform plan completed and saved to tfplan."
  artifacts:
    paths:
      - ${TF_ROOT}/tfplan
      - ${TF_ROOT}/plan.json
    reports:
      terraform: ${TF_ROOT}/plan.json
    expire_in: 1 week

apply:
  stage: apply
  <<: *terraform-cache
  when: manual
  before_script:
    - *configure-environment
    - |
      echo "Installing kubectl and cloud provider CLI tools..."
      apt-get update && apt-get install -y ca-certificates curl apt-transport-https lsb-release gnupg
      
      if [ "${CLOUD_PROVIDER}" = "azure" ]; then
        curl -sL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | tee /etc/apt/trusted.gpg.d/microsoft.gpg > /dev/null
        echo "deb [arch=amd64] https://packages.microsoft.com/repos/azure-cli/ $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/azure-cli.list
        apt-get update && apt-get install -y azure-cli
      fi
      
      curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      chmod +x kubectl
      mv kubectl /usr/local/bin/
    - *initialize-terraform
  script:
    - echo "Applying Terraform infrastructure changes..."
    - terraform apply -auto-approve tfplan
    - echo "Terraform apply completed successfully."
    - *post-apply-azure
  dependencies:
    - plan
  needs:
    - plan
  environment:
    name: ${WORKSPACE}
    on_stop: destroy

destroy:
  stage: destroy
  <<: *terraform-cache
  when: manual
  before_script:
    - *configure-environment
    - *initialize-terraform
  script:
    - echo "Executing infrastructure destruction..."
    - terraform destroy -auto-approve --var-file=./tfvars_files/$WORKSPACE.tfvars -var project_name="$PROJECT_NAMESPACE" -var gitlab_token="$GITLAB_ACCESS_TOKEN" -var gitlab_username="$GITLAB_USERNAME"
    - echo "Terraform destroy completed successfully."
  environment:
    name: ${WORKSPACE}
    action: stop
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: manual
      allow_failure: true